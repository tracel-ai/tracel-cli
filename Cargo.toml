[workspace]
# Try
# require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.5.1"
readme = "README.md"
license = "MIT OR Apache-2.0"
rust-version = "1.87.0"
authors = ["Tracel Technologies Inc."]
repository = "https://github.com/tracel-ai/tracel-cli"
keywords = ["tracel", "burn", "cli"]
categories = ["command-line-interface", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.104"
toml = "0.8.23"
toml_edit = "0.22.27"
clap = { version = "4.6.4", features = ["derive", "cargo"] }
derive-new = { version = "0.7.0", default-features = false }
tracing = "0.1.44"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9" }
thiserror = "2.0.19"
env_logger = "0.11.11"
console = "0.16.4"
cliclack = "0.5.6"
supports-hyperlinks = "3.2.0"
webbrowser = "1.2.4"
url = "2.5.8"
cargo_metadata = { version = "0.20.0", features = ["builder"] }
walkdir = "2"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ignore = "0.4.30"
gix = { version = "0.77.0", default-features = false, features = ["dirwalk"] }
chrono = "0.4.45"
strum = { version = "0.27.2", features = ["derive"] }
jsonschema = { version = "0.58.6", default-features = false }
tempfile = "3.27.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2.189"
rstest = { version = "0.27.0", default-features = false }


## External Crate
tracel-client = { git = "https://github.com/tracel-ai/burn-central-client", rev = "f517e38c4bcff597619990b8f3d1b166b1d070fc" }

## Crate
tracel-cli = { version = "0.5.0", path = "crates/tracel-cli" }

### For xtask crate ###
tracel-xtask = { version = "=5.0.0" }
[profile.dev]
debug = 0 # Speed up compilation time and not necessary.
